[project]
name = "nucleant-project"
version = "0.1.0"
description = "Build and run NucleantUI apps on Android, iOS, macOS and Linux."
readme = "README.md"
license = "MIT"
authors = [
    { name = "NucleantUI" },
]
urls = { "Homepage" = "https://github.com/NucleantUI/NucleantProject" }
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "nucleant-bootstraps>=0.1.0",
]

[project.scripts]
nucleant = "nucleant:main"

[tool.uv.build-backend]
module-name = "nucleant"

[tool.uv.sources]
nucleant-bootstraps = { git = "https://github.com/NucleantUI/nucleant-bootstraps" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: real builds (swift, gradle, xcodebuild)",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.13.0"]
build-backend = "uv_build"
